name:                testing-hs
version:             0.1.0.0
github:              "edsonhuanaco-commits/testing-hs"
license:             BSD-3-Clause
author:              "Edson Huanaco"
maintainer:          "edsonhuanaco@gmail.com"
copyright:           "2026 Edson Huanaco"

extra-source-files:
- README.md
- CHANGELOG.md

description:         Please see the README on GitHub at <https://github.com/edsonhuanaco-commits/testing-hs#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - Lib
  - Notas
  - Historial
  dependencies:
  - containers
  - mtl

executables:
  testing-hs-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - testing-hs
    - containers
    - mtl

tests:
  testing-hs-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - testing-hs
    - HUnit
    - QuickCheck
